<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d">
<title id="t">Figure 03 — Evidence matrix of domains and repositories</title>
<desc id="d">Dot matrix with eight domains as rows and ten repositories as columns. Security engineering is primary in CloudContextGuard, SentinelSphere, QR Shield and MalSim. Machine learning is primary in SentinelSphere, QR Shield and Resume Ranker. LLMs and agents in HEALIX and StudyAssistant. Backend and APIs in CloudContextGuard, SentinelSphere, QR Shield, MalSim and FinPlanPremium. Networks and traffic in SentinelSphere. Testing and documentation in CloudContextGuard. Embedded and IoT in a team IoT project.</desc>
