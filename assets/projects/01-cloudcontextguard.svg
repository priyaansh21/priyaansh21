<text x="1018.0" y="412" font-size="14" fill="#8b929b" class="mono" text-anchor="middle">sole authority</text>
<text x="1136" y="438" font-size="12" fill="#5b636d" class="mono" text-anchor="end">scenario T2 · trusted identity, untrusted network</text>
