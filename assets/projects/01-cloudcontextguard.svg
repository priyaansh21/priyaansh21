<text x="64" y="72" font-size="15" fill="#d9a441" class="mono">EVIDENCE I</text>
<text x="1136" y="72" font-size="14" fill="#8b929b" class="mono" text-anchor="end">IMPLEMENTATION · LOCAL SIMULATION</text>
<text x="64" y="136" font-size="54" fill="#e6e3dc" class="serif">CloudContextGuard</text>
<text x="64" y="176" font-size="15" fill="#8b929b" class="mono">SIX INDEPENDENT INPUTS → ONE AUTHORITY → ALLOW | DENY</text>
