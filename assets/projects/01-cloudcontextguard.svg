<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d">
<title id="t">Evidence I — CloudContextGuard decision pipeline</title>
<desc id="d">Plate showing five evaluator columns — IAM, VPC, POLICY, MFA, RISK — feeding a decision engine. In scenario T2 IAM passes, VPC fails, the remaining checks are still evaluated, and the decision engine returns DENY. Below: the seven named risk factors and their points (external network 40, restricted resource 40, confidential resource 30, missing MFA 30, unknown/untrusted source 20, suspicious request 20, repeated failed requests 10) and the level thresholds LOW, MEDIUM at 30, HIGH at 60, CRITICAL at 80.</desc>
<style>
.serif{font-family:Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;letter-spacing:.08em}
.flow{stroke-dasharray:6 8;animation:flow 2.4s linear infinite}
.pulse{animation:pulse 3.2s ease-in-out infinite}
.sweep{animation:sweep 9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(var(--sweep,400px))}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.sweep{animation:none}}
</style>
