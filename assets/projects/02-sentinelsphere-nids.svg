<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="t d">
<title id="t">Evidence II — SentinelSphere hybrid intrusion detection</title>
<desc id="d">Plate showing a packet stream on a time axis with a SYN burst near 'now', and three rolling windows: 60 seconds for authentication attempts, 30 seconds for unique destination ports and flow volume, 10 seconds for SYN and ICMP rates. Below, five signature rules (SYN flood, ICMP flood, port scan, brute force, ARP spoof) and two models (Isolation Forest anomaly scoring, Random Forest over five attack families) feed an alert; signatures override the model.</desc>
