<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="t d">
<title id="t">Studies IV and V — MalSim scoring and the HEALIX governed pipeline</title>
<desc id="d">Left: MalSim's composite threat score, weighted static 0.35, dynamic 0.30, YARA 0.20, network 0.15, mapped to CLEAN below 10, LOW from 10, MEDIUM from 40, HIGH from 70; sandbox stages are simulated, file hashes are computed. Right: HEALIX's six-stage pipeline — ingest, context, reason, govern, act, learn — with governance highlighted. Payment actions have zero autonomy and always require approval.</desc>
