<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
<title id="t">Priyaansh Jaiswal — Systems that decide what to trust</title>
<desc id="d">Opening frame. Left: the name Priyaansh Jaiswal and the line 'Systems that decide what to trust.' Right: an architectural plan of six nested rooms with aligned doors labelled IAM, VPC, POLICY, MFA, RISK and DECISION. A request enters, passes the IAM door, fails at the VPC door, and the decision room reads DENY — a real scenario from the CloudContextGuard threat model.</desc>
