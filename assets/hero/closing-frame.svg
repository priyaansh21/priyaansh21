<title id="t">Closing frame — Trust is a conclusion, not a default</title>
<desc id="d">Closing frame, mirrored from the opening. The six-room plan now sits on the left with its doors facing left; a request passes every door and the decision room reads ALLOW. Right: the line 'Trust is a conclusion, not a default.'</desc>
